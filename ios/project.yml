name: ParvAI
options:
  bundleIdPrefix: com.parv
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

targets:
  ParvAI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ParvAI
        excludes:
          - Resources/Info.plist
    entitlements:
      path: ParvAI/Resources/ParvAI.entitlements
    info:
      path: ParvAI/Resources/Info.plist
      properties:
        NSFaceIDUsageDescription: "ParvAI uses Face ID to authenticate you with your personal AI brain."
        NSMicrophoneUsageDescription: "ParvAI uses the microphone for push-to-talk voice input to your personal AI."
        NSSpeechRecognitionUsageDescription: "ParvAI transcribes your voice on-device to send commands to your AI brain."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - fetch
          - processing
        UILaunchScreen: {}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.parv.parvai
      SWIFT_VERSION: "5.9"
      DEVELOPMENT_TEAM: ""        # fill in your Apple Team ID
      CODE_SIGN_STYLE: Automatic
      GENERATE_INFOPLIST_FILE: NO
      SWIFT_COMPILATION_MODE: singlefile
