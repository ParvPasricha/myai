name: ParvAI
options:
  bundleIdPrefix: com.parv
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.9.0

targets:
  ParvAI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ParvAI
    resources:
      - path: ParvAI/Resources/Info.plist
    entitlements:
      path: ParvAI/Resources/ParvAI.entitlements
    info:
      path: ParvAI/Resources/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.parv.parvai
      SWIFT_VERSION: "5.9"
      DEVELOPMENT_TEAM: ""        # fill in your Apple Team ID
      CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: WhisperKit
